name: Build and Push Docker Image

# 当代码推送到 main 分支或创建 pull request 时触发
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 检出代码仓库
    - name: Checkout code
      uses: actions/checkout@v3

    # 使用 Docker 构建镜像
    - name: Build Docker image
      run: docker build -t your_dockerhub_username/your_image_name:${{ github.sha }} .

